<!DOCTYPE html>
<html lang="zu">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAULT OWNER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial;padding:12px}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.logo{font-size:32px;font-weight:900;color:#FFD700}.badge{background:#FFD700;color:#000;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:bold}
.tabs{display:flex;gap:8px;margin-bottom:15px}.tab{padding:10px 18px;border-radius:20px;border:none;font-weight:bold;cursor:pointer}.active{background:#FFD700;color:#000}.inactive{background:#222;color:#aaa}
.card{background:#111;border:1px solid #333;border-radius:20px;padding:20px}
.rev{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}
.box{border-radius:16px;padding:18px;border:1px solid #333}.gold{border:1px solid #FFD700;background:#191500}
.big{font-size:32px;font-weight:900;color:#FFD700;margin:8px 0}
.btn{width:100%;padding:14px;border-radius:12px;border:none;font-weight:bold;cursor:pointer;margin:6px 0}
.red{background:#ff0000;color:#fff}.dark{background:#222;color:#fff}
#ageGate{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.ageBox{border:2px solid #FFD700;border-radius:20px;padding:25px;width:100%;max-width:380px;text-align:center;background:#0a0a0a}
input{width:100%;padding:16px;border-radius:12px;border:2px solid #FFD700;background:#000;color:#fff;font-size:20px;text-align:center;letter-spacing:2px;margin:15px 0}
</style>
</head>
<body>

<div id="ageGate"><div class="ageBox">
<h2 style="color:#FFD700">🔞 18+ ONLY - ID VERIFY</h2>
<p style="color:#888;margin:10px 0">Faka ID - 30 sec only</p>
<input id="idNumber" type="tel" maxlength="13" placeholder="9311246131082">
<button style="width:100%;padding:16px;border-radius:12px;border:none;background:#FFD700;color:#000;font-weight:bold;font-size:16px" onclick="verify()">🔍 Verify 18+ (13 digits)</button>
</div></div>

<div class="hdr"><div><span class="logo">VAULT</span> <span class="badge">OWNER</span></div><button class="tab inactive" onclick="location.reload()">Logout</button></div>

<div class="tabs">
<button class="tab active">📊 Overview</button>
<button class="tab inactive" onclick="alert('Creators tab - 248 active')">🎬 Creators</button>
<button class="tab inactive" onclick="alert('Payouts - FNB 6283***1234')">💰 Payouts</button>
</div>

<div class="card">
<h2>MY Business Account (OWNER) 🔞</h2>
<div class="rev">
<div class="box gold">
<p style="color:#aaa">TOTAL REVENUE</p>
<div class="big">R 12,450</div>
<p style="font-size:12px;color:#aaa">FNB • 6283*** 1234</p>
<button class="btn" style="background:#FFD700;color:#000;margin-top:10px;font-size:12px;padding:6px 12px;width:auto;border-radius:20px">MY ACCOUNT</button>
</div>
<div class="box">
<p style="color:#aaa">Active 18+</p>
<div class="big" style="color:#fff">248</div>
<p style="color:#aaa">Vouchers</p>
</div>
</div>

<div style="background:#1a0000;border:1px solid #ff0000;border-radius:16px;padding:16px;margin-top:10px">
<p style="color:#ff0000;font-weight:bold;margin-bottom:10px">🔴 LIVE CONTROL (Owner)</p>
<button class="btn red">🔴 START LIVE - Qala Bukhoma</button>
<button class="btn dark">Stop Live</button>
<p style="color:#888;font-size:12px;margin-top:10px">Qala live - Abalandeli bazobona 🔴 LIVE button</p>
</div>

<div style="margin-top:15px">
<h3>📲 Engeza Abantu:</h3>
<input id="lnk" value="https://isango-vault-2026.vercel.app/?creator=NEW&role=viewer" style="font-size:12px;padding:10px">
<button class="btn" style="background:#333;color:#fff" onclick="navigator.clipboard.writeText(document.getElementById('lnk').value);alert('Link copied - Thumela kumuntu!')">📋 Copy Creator Link</button>
</div>
</div>

<script>
function verify(){
let v=document.getElementById('idNumber').value;
if(v.length<13){alert('Faka 13 digits');return;}
document.getElementById('ageGate').style.display='none';
}
let p=new URLSearchParams(location.search);
if(p.get('role')=='owner'){document.getElementById('ageGate').style.display='none';}
if(p.get('role')=='viewer'){document.getElementById('ageGate').style.display='none';}
</script>
</body>
</html>
