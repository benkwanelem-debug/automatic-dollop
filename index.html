<!DOCTYPE html><html lang="zu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VAULT FIXED 2026</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial;padding:10px}.hdr{display:flex;justify-content:space-between;margin-bottom:12px}.logo{font-size:26px;font-weight:900;color:#FFD700}.badge{padding:5px 10px;border-radius:14px;font-size:10px;font-weight:900;background:#FFD700;color:#000}.card{background:#111;border:1px solid #2a2a2a;border-radius:16px;padding:14px;margin-bottom:10px}.box{border-radius:10px;padding:10px;border:1px solid #2a2a2a;background:#151515;margin-bottom:6px}.gold{border:1.5px solid #FFD700;background:#1a1600}.big{font-size:26px;font-weight:900;color:#FFD700}.btn{width:100%;padding:11px;border-radius:9px;border:none;font-weight:900;margin:5px 0;font-size:12px}.goldBtn{background:#FFD700;color:#000}.dark{background:#222;color:#fff;border:1px solid #333}.blueBtn{background:#0088ff;color:#fff}.small{font-size:10px;color:#888}input{width:100%;padding:11px;border-radius:8px;border:1.5px solid #FFD700;background:#000;color:#fff;margin:6px 0}.row{display:flex;gap:6px}.row>*{flex:1}#ageGate{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:9999;padding:18px}.ageBox{border:2px solid #FFD700;border-radius:16px;padding:18px;width:100%;max-width:400px;text-align:center;background:#0a0a0a}</style></head><body><div id="ageGate"><div class="ageBox"><h2 style="color:#FFD700">🔞 18+ VERIFY</h2><input id="gateInput" type="tel" value="9311246131082"><button class="btn goldBtn" onclick="document.getElementById('ageGate').style.display='none';init()">✅ Ngena</button></div></div><div class="hdr"><div><span class="logo">VAULT</span> <span class="badge">OWNER</span></div><div style="text-align:right"><p id="userName" style="font-weight:900;color:#FFD700;font-size:12px">Owner</p><p class="small">R12,450</p></div></div><div id="ownerTab" class="card"><h2>👑 Owner Dashboard</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0"><div class="box gold"><p class="small">TOTAL REVENUE</p><div class="big">R 12,450</div></div><div class="box"><p class="small">Creators</p><div class="big" style="color:#fff" id="statCount">0</div></div></div><div style="background:#151515;border:1px solid #FFD700;border-radius:12px;padding:12px"><h3 style="color:#FFD700;font-size:13px">➕ ENGEZA CREATOR - Bank + Number</h3><input id="cName" placeholder="Igama: Thando"><div class="row"><input id="cPhone" placeholder="Number: 0712345678"><input id="cBank" placeholder="Bank: FNB"></div><div class="row"><input id="cAcc" placeholder="Account No"><input id="cHolder" placeholder="Holder"></div><button class="btn goldBtn" onclick="addCreator()">✅ Add Creator + Generate Link</button><div id="list"></div></div></div><div id="creatorTab" class="card" style="display:none"><h2 id="cTitle" style="color:#00ff88">Creator</h2><div id="acceptBox" style="background:#1a1600;border:1.5px solid #FFD700;border-radius:12px;padding:12px"><p class="small">Faka number yakho ukuze u-accept</p><input id="acceptPhone" placeholder="071..."><button class="btn goldBtn" onclick="accept()">✅ Accept Nge Number</button><p class="small">Bank: <span id="bankInfo">-</span></p></div><div id="dash" style="display:none"><div style="margin-top:12px;background:#151515;border:1px solid #0088ff;border-radius:12px;padding:12px"><h3 style="color:#0088ff;font-size:13px">🔗 Follower Link - Yakhe QHA!</h3><input id="fLink" readonly style="font-size:10px"><button class="btn blueBtn" onclick="navigator.clipboard.writeText(document.getElementById('fLink').value).then(()=>alert('Copied! Thumela kubalandeli - Babona yakhe QHA!'))">📋 Copy Follower Link - Babona Yakhe QHA</button></div></div></div><div id="viewerTab" class="card" style="display:none"><h2 id="vTitle" style="color:#0088ff">Viewer</h2><div id="vContent"></div></div><script>
let cur=null;
function getP(){let p=new URLSearchParams(location.search);return{creator:p.get('creator')||'',viewerOf:p.get('viewerOf')||''};}
function init(){let pr=getP();if(pr.viewerOf){showViewer(pr.viewerOf);return;}if(pr.creator){cur=pr.creator;showCreator(pr.creator);return;}showOwner();}
function showOwner(){document.getElementById('ownerTab').style.display='block';document.getElementById('creatorTab').style.display='none';document.getElementById('viewerTab').style.display='none';render();}
function showCreator(name){
document.getElementById('ownerTab').style.display='none';document.getElementById('creatorTab').style.display='block';document.getElementById('viewerTab').style.display='none';
document.getElementById('cTitle').innerText='Sawubona '+name;
let list=JSON.parse(localStorage.getItem('vault_creators_full')||'[]');let cr=list.find(c=>c.name.toLowerCase()==name.toLowerCase());
if(!cr){document.getElementById('acceptBox').innerHTML='Akakho';return;}
document.getElementById('bankInfo').innerText=cr.bank+' '+cr.acc;
if(cr.status=='active'){document.getElementById('acceptBox').style.display='none';document.getElementById('dash').style.display='block';document.getElementById('fLink').value=location.origin+location.pathname+'?viewerOf='+encodeURIComponent(name);}
}
function showViewer(name){
document.getElementById('ownerTab').style.display='none';document.getElementById('creatorTab').style.display='none';document.getElementById('viewerTab').style.display='block';
let list=JSON.parse(localStorage.getItem('vault_creators_full')||'[]');let cr=list.find(c=>c.name.toLowerCase()==name.toLowerCase());
if(!cr){document.getElementById('vContent').innerHTML='Akatholakali';return;}
document.getElementById('vTitle').innerText='👁️ Ubukela '+cr.name+' - YAKHE QHA!';
document.getElementById('vContent').innerHTML='<div class=box style=border-color:#0088ff><p style=color:#0088ff>📺 Channel ka '+cr.name+' - YAKHE QHA - Ababoni abanye!</p><p class=small>Bank: '+cr.bank+' '+cr.acc+' • '+cr.holder+'</p><p class=small style=margin-top:8px>Owner um-addile - U-acceptile nge-number yakhe - Manje abalandeli bakhe babona okwakhe QHA!</p></div>';
}
function addCreator(){
let n=document.getElementById('cName').value.trim(),p=document.getElementById('cPhone').value.trim(),b=document.getElementById('cBank').value.trim(),a=document.getElementById('cAcc').value.trim(),h=document.getElementById('cHolder').value.trim();
if(!n||!p||!b||!a){alert('Gcwalisa');return;}
let list=JSON.parse(localStorage.getItem('vault_creators_full')||'[]');list.push({name:n,phone:p,bank:b,acc:a,holder:h||n,status:'pending'});localStorage.setItem('vault_creators_full',JSON.stringify(list));
alert('✅ '+n+' wengeziwe!\\nCreator Link (Accept nge-number):\\n'+location.origin+location.pathname+'?creator='+encodeURIComponent(n)+'&role=creator\\n\\nFollower Link (Yakhe QHA):\\n'+location.origin+location.pathname+'?viewerOf='+encodeURIComponent(n));
render();
}
function render(){
let list=JSON.parse(localStorage.getItem('vault_creators_full')||'[]');let c=document.getElementById('list');document.getElementById('statCount').innerText=list.length;
if(!list.length){c.innerHTML='<p class=small>Awekho</p>';return;}c.innerHTML='';list.forEach(cr=>{
let d=document.createElement('div');d.className='box';d.innerHTML='<b>'+cr.name+' - '+cr.status+'</b><br><small>'+cr.phone+' • '+cr.bank+' '+cr.acc+'</small><br><div class=row style=margin-top:6px><button class=btn dark style=width:auto;padding:6px 10px;font-size:10px;background:#333;color:#fff' + ' onclick=navigator.clipboard.writeText("'+location.origin+location.pathname+'?creator='+encodeURIComponent(cr.name)+'&role=creator")>📋 Creator Link (Accept nge-number)</button><button class=btn dark style=width:auto;padding:6px 10px;font-size:10px;background:#0088ff;color:#fff;margin-left:4px' + ' onclick=navigator.clipboard.writeText("'+location.origin+location.pathname+'?viewerOf='+encodeURIComponent(cr.name)+'")>👁️ Follower Link - Yakhe QHA</button></div>';c.appendChild(d);
});
}
function accept(){
let phone=document.getElementById('acceptPhone').value.trim();let list=JSON.parse(localStorage.getItem('vault_creators_full')||'[]');let cr=list.find(c=>c.name.toLowerCase()==cur.toLowerCase());
if(phone.slice(-9)!=cr.phone.slice(-9)){alert('Number ayifani! Faka: '+cr.phone);return;}
cr.status='active';localStorage.setItem('vault_creators_full',JSON.stringify(list));document.getElementById('acceptBox').style.display='none';document.getElementById('dash').style.display='block';document.getElementById('fLink').value=location.origin+location.pathname+'?viewerOf='+encodeURIComponent(cur);alert('✅ Wamukelekile! Follower Link yakho: '+document.getElementById('fLink').value);
}
init();
</script></body></hthtml
