<div style="margin-top:15px; border:1px solid gold; padding:10px; border-radius:10px; background:#111;">
  <label style="color:gold; font-weight:bold; display:block; margin-bottom:5px;">💰 Payout Method</label>
  <select id="payoutMethod" style="width:100%; padding:12px; border:1px solid gold; border-radius:8px; background:#000; color:white; margin-bottom:12px;">
    <option>Select payout method —</option>
    <option>TymeBank</option>
    <option>Capitec</option>
    <option>FNB</option>
    <option>ABSA</option>
    <option>Instant Money (Pick n Pay / Shoprite)</option>
    <option>Cash Send (FNB)</option>
    <option>eWallet (Standard Bank)</option>
  </select>

  <label style="color:gold; font-weight:bold; display:block; margin-bottom:5px;">🏦 Account / Phone for Payout</label>
  <input id="payoutAccount" placeholder="Enter account number or phone for payout" style="width:100%; padding:12px; border:1px solid gold; border-radius:8px; background:#000; color:white;" />
</div>
