<!DOCTYPE html>
<html lang="zu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISANGO VAULT - 18+</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial}
.card{background:#1a1a1a;border-radius:12px;padding:20px;margin:10px;border:1px solid #333}
input{width:100%;padding:14px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;margin:8px 0}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:6px 0}
.btn-y{background:#FFD700;color:#000}
.btn-g{background:#222;color:#fff;border:1px solid #555}
.link{color:#FFD700;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<div style="max-width:420px;margin:20px auto">

<div id="ageGate" class="card">
<h2 style="color:#FFD700">🔞 ISANGO VAULT 18+</h2>
<p style="margin:10px 0;color:#aaa">Faka ID yakho - 13 digits</p>
<input id="idNumber" type="tel" maxlength="13" placeholder="9311246131082">
<button class="btn btn-y" onclick="verifyID()">🔍 Ngena Manje</button>
</div>

<div id="loginView" class="card" style="display:none">
<h2>ISANGO VAULT ✅</h2>
<p style="color:#0f0;margin:10px 0">✅ ID Verified - 18+ OK</p>
<a class="btn btn-y" href="?role=owner" style="display:block;text-align:center;text-decoration:none">👑 Owner Dashboard</a>
<a class="btn btn-g" href="?creator=12345&role=viewer" style="display:block;text-align:center;text-decoration:none">👁️ Viewer Test</a>
</div>

<div id="ownerView" class="card" style="display:none">
<h3>👑 Owner - R1280</h3>
<button class="btn btn-y" onclick="alert('Upload feature - Faka video yakho!')">🎬 UPLOAD VIDEO</button>
<a class="btn btn-g" href="?" style="display:block;text-align:center;text-decoration:none">⬅️ Phuma</a>
</div>

<div id="viewerView" class="card" style="display:none">
<h3>👁️ Viewer</h3>
<p>Video Player - R49 voucher</p>
<video controls style="width:100%;border-radius:8px;background:#000;height:200px"></video>
<a class="btn btn-g" href="?" style="display:block;text-align:center;text-decoration:none">⬅️ Phuma</a>
</div>

</div>
<script>
function verifyID(){
let id=document.getElementById('idNumber').value;
if(id.length<13){alert('Faka 13 digits');return;}
document.getElementById('ageGate').style.display='none';
document.getElementById('loginView').style.display='block';
}
let p=new URLSearchParams(location.search);
if(p.get('role')=='owner'){document.getElementById('ageGate').style.display='none';document.getElementById('loginView').style.display='none';document.getElementById('ownerView').style.display='block';}
if(p.get('role')=='viewer'){document.getElementById('ageGate').style.display='none';document.getElementById('loginView').style.display='none';document.getElementById('viewerView').style.display='block';}
</script>
</body>
</html>
