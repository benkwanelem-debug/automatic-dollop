<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VAULT MANUAL TYMEBANK</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:Arial;padding:12px}.logo{font-size:28px;font-weight:900;color:#d4af37}.tabs{display:flex;gap:5px;margin:10px 0;overflow:auto}.tab{padding:8px 14px;border-radius:20px;border:none;font-weight:700;font-size:11px}.tab.a{background:#d4af37;color:#000}.tab:not(.a){background:#222;color:#888}.card{background:#151515;border:1px solid #333;border-radius:14px;padding:12px;margin:10px 0}.tuck{background:linear-gradient(135deg,#d4af37,#a67c00);color:#000;padding:14px;border-radius:12px;margin:8px 0;font-weight:800;font-size:14px} input,select{width:100%;padding:14px;margin:7px 0;background:#111;color:#fff;border:2px solid #d4af37;border-radius:10px;font-size:15px} .b{width:100%;padding:14px;border:none;border-radius:10px;font-weight:900;margin:7px 0;font-size:13px}.y{background:#d4af37;color:#000}.g{background:#0a0;color:#fff}.box{background:#222;padding:10px;margin:6px 0;border-radius:9px;border:1px solid #333}</style></head><body>
<div style="display:flex;justify-content:space-between"><span class=logo>VAULT</span><span style="background:#d4af37;color:#000;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:800">MANUAL ADD</span></div>
<div class=tabs><button class="tab a" id=t0 onclick="show('ov',0)">📊 Overview</button><button class="tab" id=t1 onclick="show('biz',1)">💰 Add Business</button><button class="tab" id=t2 onclick="show('cre',2)">🎬 Performers</button><button class="tab" id=t3 onclick="show('vouch',3)">🎫 Vouchers</button></div>

<div id=ov class=card>
<h3>🏦 MY BUSINESS - Overview</h3>
<div id=showBiz class=tuck>Akukho Business Account - Hamba ku Add Business → Faka TymeBank Yakho Manually!</div>
</div>

<div id=biz class=card style=display:none>
<h2 style="color:#d4af37">💰 FAKA BUSINESS ACCOUNT YAKHO MANUALLY</h2>
<p style="color:#888;font-size:12px">Faka wena - Manual - TymeBank Yakho - Izogcina efonini yakho kuphela!</p>

<div style="background:#000;border:2px solid #d4af37;border-radius:14px;padding:14px;margin:12px 0">
<label style="color:#d4af37;font-size:13px;font-weight:800">1. Business Name:</label>
<input id=bname placeholder="Example: Yakho Trading - Faka igama le business yakho">

<label style="color:#d4af37;font-size:13px;font-weight:800">2. Khetha Bank:</label>
<select id=bbank><option>TymeBank</option><option>Capitec</option><option>FNB</option><option>ABSA</option><option>Standard Bank</option></select>

<label style="color:#d4af37;font-size:13px;font-weight:800">3. Account Number Yakho - Faka Manually Lapha:</label>
<input id=bacc placeholder="Faka account number yakho lapha - 5100..." style="font-size:20px;font-weight:900;letter-spacing:2px;text-align:center;border:2px solid #0f0">

<label style="color:#d4af37;font-size:13px;font-weight:800">4. Branch Code:</label>
<input id=bbranch placeholder="TymeBank: 678910 - Faka lapha" value="678910">

<label style="color:#d4af37;font-size:13px;font-weight:800">5. Phone:</label>
<input id=bphone placeholder="071... - Faka phone yakho">

<button class="b y" onclick="saveBiz()" style="font-size:16px;margin-top:14px">💾 SAVE - GCINA BUSINESS ACCOUNT YAMI MANJE</button>
<div id=msg style="text-align:center;margin-top:10px;font-weight:800"></div>
</div>

<div id=bizList></div>
</div>

<div id=cre class=card style=display:none><h2>🎬 Performers</h2><input id=pn placeholder="Igama"><input id=pp placeholder="Phone 071..."><button class="b g" onclick="addP()">+ Add Performer</button><div id=pl></div></div>
<div id=vouch class=card style=display:none><h2>🎫 Vouchers</h2><button class="b y" onclick="genV()">Generate PIN R50</button><div id=vlist></div><input id=pin placeholder="Faka PIN"><button class="b g" onclick="usePin()">Verify PIN</button><div id=vmsg></div></div>

<script>
function show(id,i){['ov','biz','cre','vouch'].forEach(x=>document.getElementById(x).style.display='none');document.getElementById(id).style.display='block';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('a'));document.getElementById('t'+i).classList.add('a');render();}
function saveBiz(){if(!bacc.value.trim())return alert('Faka Account Number!');let biz={name:bname.value||'My Business',bank:bbank.value,acc:bacc.value.trim(),branch:bbranch.value,phone:bphone.value};localStorage.BIZ=JSON.stringify(biz);document.getElementById('msg').innerHTML='✅ SAVED! '+biz.bank+' - '+biz.acc+' - Ivela ku Overview!';render();setTimeout(()=>show('ov',0),1200);}
function addP(){if(!pn.value)return alert('Faka igama');let p=JSON.parse(localStorage.P||'[]');p.push({name:pn.value,phone:pp.value});localStorage.P=JSON.stringify(p);pn.value='';pp.value='';render();}
function genV(){let c=Math.floor(10000000+Math.random()*90000000).toString();let v=JSON.parse(localStorage.VC||'[]');v.push({code:c,used:false});localStorage.VC=JSON.stringify(v);render();}
function usePin(){let c=pin.value.trim();let v=JSON.parse(localStorage.VC||'[]');let f=v.find(x=>x.code==c);if(!f){vmsg.innerHTML='❌ PIN ayilungile';return;}f.used=true;localStorage.VC=JSON.stringify(v);vmsg.innerHTML='✅ Verified!';render();}
function render(){let biz=JSON.parse(localStorage.BIZ||'null');if(!biz){document.getElementById('showBiz').innerHTML='❌ Akukho Business Account - Chofoza 💰 Add Business → Faka TymeBank Yakho Manually!';document.getElementById('bizList').innerHTML='';}else{document.getElementById('showBiz').innerHTML='💼 '+biz.name+'<br>🏦 Bank: '+biz.bank+'<br>💳 Account: <b style="font-size:20px">'+biz.acc+'</b><br>Branch: '+biz.branch+'<br>📱 '+biz.phone+'<br>✅ Saved Manually - Yeyakho!';document.getElementById('bizList').innerHTML='<div class=tuck>✅ SAVED MANUALLY:<br>🏦 '+biz.name+'<br>💳 '+biz.acc+'<br>🏦 '+biz.bank+' - '+biz.branch+'</div>';bname.value=biz.name;bbank.value=biz.bank;bacc.value=biz.acc;bbranch.value=biz.branch;bphone.value=biz.phone;}let P=JSON.parse(localStorage.P||'[]');pl.innerHTML=P.map(x=>'<div class=box>👑 '+x.name+' - '+x.phone+'</div>').join('')||'Akukho';let VC=JSON.parse(localStorage.VC||'[]');vlist.innerHTML=VC.map(v=>'<div class=box>🎫 PIN: <b style=color:gold>'+v.code+'</b></div>').join('')||'';}
render();
</script></body></html>
