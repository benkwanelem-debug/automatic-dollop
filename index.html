<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISANGO VAULT 18+ | Voucher 16-Digit</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#070707;color:#fff;font-family:Arial;text-align:center;padding:20px}
.hero{padding:60px 20px}h1{font-size:3rem;color:#FFD700}h1 span{color:#fff}.subtitle{opacity:.6;margin-top:10px}
.box{background:#151515;border:1px solid #333;max-width:420px;margin:30px auto;padding:25px;border-radius:14px}
input{width:100%;padding:16px;font-size:20px;letter-spacing:4px;text-align:center;background:#000;color:#FFD700;border:1px solid #444;border-radius:10px;margin:15px 0}
.btn{width:100%;padding:15px;background:#FFD700;color:#000;border:none;border-radius:10px;font-weight:bold;font-size:17px}
.msg{margin-top:15px;min-height:24px;font-weight:bold}.footer{opacity:.3;margin-top:50px;font-size:12px}
</style></head><body>
<div class="hero"><h1>ISANGO <span>VAULT</span></h1><p class="subtitle">Isango — Where Heritage is Forever</p></div>
<div class="box">
<h3 style="color:#FFD700">🔐 Enter 16-Digit Voucher</h3>
<input id="code" maxlength="19" placeholder="0000 0000 0000 0000" inputmode="numeric">
<button class="btn" onclick="check()">Unlock Vault</button>
<div id="msg" class="msg"></div>
</div>
<div class="footer">Built by Benkwanelem • Isango Vault 2026</div>
<script>
function check(){
let c=document.getElementById('code').value.replace(/\s/g,'');
let m=document.getElementById('msg');
if(c.length!==16||!/^\d+$/.test(c)){m.style.color='#ff4444';m.innerText='❌ Faka inombolo engu-16 egcwele!';return;}
m.style.color='#00ff88';m.innerText='✅ Voucher Yamukelekile: '+c.slice(0,4)+' '+c.slice(4,8)+' '+c.slice(8,12)+' '+c.slice(12)+' 🔓 Welcome to ISANGO VAULT!';}
document.getElementById('code').addEventListener('input',e=>{
let v=e.target.value.replace(/\D/g,'').slice(0,16);
e.target.value=v.replace(/(.{4})/g,'$1 ').trim();
});
</script></body></html>
