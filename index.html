<div id="business" class="card">
<div class="header-badge"><h3 style="margin:5px">Business / Withdraw</h3><span>Secure</span></div>

<label>🏢 Igama le App / Business Name</label>
<input id="appName" placeholder="Isango Vault - Lerato" />

<label>Balance Yakho</label>
<input value="R 4,250 - Available" disabled />

<div style="border:1px dashed gold;padding:10px;border-radius:10px;margin-top:15px">
<h4 style="color:gold;margin:5px 0">🏦 Bank Details - For Payout</h4>

<label>Bank Name</label>
<select id="bankName">
<option>Select bank —</option>
<option>TymeBank</option>
<option>Capitec</option>
<option>FNB</option>
<option>ABSA</option>
<option>Standard Bank</option>
<option>Nedbank</option>
</select>

<label>Account Holder Name</label>
<input id="accHolder" placeholder="Lerato Dlamini" />

<label>Account Number</label>
<input id="accNumber" placeholder="1234567890" />

<label>Branch Code (Optional)</label>
<input id="branchCode" placeholder="250655" />

<label>Phone Linked to Bank / eWallet</label>
<input id="bankPhone" placeholder="071 234 5678 - For Instant Money / CashSend" />
</div>

<label style="margin-top:15px">Amount to Withdraw</label>
<input id="withdrawAmount" placeholder="R 500" />

<button onclick="saveBusiness()">💾 Save Business + Request Withdraw</button>

<div style="margin-top:15px">
<div class="stat"><span>Last Payout</span><span>R 1,200 - Capitec - Success</span></div>
<div class="stat"><span>Payout History</span><span>View All</span></div>
</div>
</div>

<script>
function saveBusiness(){
let app=document.getElementById('appName').value;
let bank=document.getElementById('bankName').value;
let holder=document.getElementById('accHolder').value;
let acc=document.getElementById('accNumber').value;
let amount=document.getElementById('withdrawAmount').value;
if(!app || bank.includes('Select')){alert('⚠️ Faka Igama le App ne Bank!');return;}
alert("✅ Business Saved!\n\nApp: "+app+"\nBank: "+bank+"\nHolder: "+holder+"\nAcc: "+acc+"\nWithdraw: "+amount+"\n\n💸 Payout izongena ku "+bank+"!");
}
</script>
